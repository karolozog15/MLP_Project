name: quarto

on:
  push:
  workflow_dispatch:

jobs:
  render-report:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Quarto i TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jupyter \
            nbclient \
            ipykernel \
            numpy \
            matplotlib \
            pillow \
            open-atmos-jupyter-utils \
            PyMPDATA

          python -m ipykernel install \
            --user \
            --name python3 \
            --display-name "Python 3"

      - name: Instalacja zależności systemowych
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Wygenerowanie sprawozdania PDF
        run: |
          quarto render cyklogeneza2.ipynb \
            --to pdf \
            --output sprawozdanie.pdf \
            --execute \
            -M execute.echo=false \
            -M execute.warning=false \
            -M execute.error=false

      - name: Przygotowanie artefaktów
        run: |
          mkdir -p artifacts

          cp sprawozdanie.pdf artifacts/

          find . \
            -type f \
            -name "*.gif" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" \
            -exec cp {} artifacts/ \;

      - name: Zapisanie PDF i GIF jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: sprawozdanie-cyklogeneza
          path: artifacts/
          if-no-files-found: error
